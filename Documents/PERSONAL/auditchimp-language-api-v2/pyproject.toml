[tool.poetry]
name = "auditchimp-language-api"
version = "2.0.0"
description = "Fast Transcription and Diarization API with GPU/CPU support"
authors = ["auditchimp"]
packages = [{include = "auditchimp"}]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu13"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.9,<3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
pydantic = "^2.5.0"
python-multipart = "^0.0.6"
aiofiles = "^23.2.1"
python-dotenv = "^1.0.0"
faster-whisper = "^0.10.0"
torch = {version = "^2.0.0", source = "pytorch"}
torchaudio = {version = "^2.0.0", source = "pytorch"}
pyannote-audio = "^3.1.1"
nemo-toolkit = {version = "^1.22.0", optional = true}
psutil = "^5.9.6"
pydub = "^0.25.1"
numpy = "^1.24.0"
soundfile = "^0.12.1"

[tool.poetry.extras]
cpu = ["pyannote-audio"]
gpu = ["nemo-toolkit", "pyannote-audio"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
auditchimp-api = "auditchimp.main:main"
