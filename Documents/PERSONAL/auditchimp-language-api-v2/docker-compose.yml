version: '3.8'

services:
  achimp-lang-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QUANTIZATION=true
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=auto
      - WHISPER_COMPUTE_TYPE=int8_float16
      - DIARIZATION_USE_GPU=true
      - DIARIZATION_MODEL=pyannote/speaker-diarization-3.1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=4
      - DATABASE_URL=sqlite:///./auditchimp.db
      - MAX_FILE_SIZE=100000000
      - SUPPORTED_FORMATS=mp3,wav,flac,m4a,ogg,webm
      - CHUNK_SIZE=30
      - MAX_CONCURRENT_JOBS=3
      - MODEL_CACHE_DIR=./models
      - MAX_CACHE_SIZE=10GB
      - LOG_LEVEL=INFO
      - LOG_FILE=./logs/auditchimp.log
      - HF_HOME=./models
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_TOKEN=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
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./logs:/app/logs
      - ./auditchimp.db:/app/auditchimp.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

